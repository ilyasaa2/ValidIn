<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Portal - ValidIn</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body style="justify-content: center; align-items: center; background-color: var(--bg-canvas);">
  <div style="max-width: 440px; width: 100%; padding: 20px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-symbol" style="width: 44px; height: 44px; font-size: 1.3rem; margin: 0 auto 12px; border-radius: var(--radius-sm);">V</div>
      <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--navy-900); letter-spacing: -0.02em;">ValidIn Campus Registry</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Portal Otentikasi Pengesahan & Pengajuan Dokumen</p>
    </div>

    <div class="card-panel" style="padding: 32px;">
      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="form-group">
          <label class="form-label">Nomor Induk (NIM / NIP)</label>
          <input type="text" class="form-input" value="210102045" placeholder="Masukkan NIM atau NIP..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Kata Sandi</label>
          <input type="password" class="form-input" value="password123" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
          Masuk ke Portal
        </button>
      </form>

      <!-- Quick Role Selection for Demonstration -->
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--border-strong);">
        <div style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); text-align: center; margin-bottom: 12px;">
          Pilih Peran untuk Evaluasi Cepat:
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <button class="btn btn-outline btn-sm" onclick="loginAs('ketua')">Ketua Organisasi</button>
          <button class="btn btn-outline btn-sm" onclick="loginAs('pembina')">Dosen Pembina</button>
          <button class="btn btn-outline btn-sm" onclick="loginAs('mahasiswa')">Mahasiswa</button>
          <button class="btn btn-outline btn-sm" onclick="loginAs('admin')">Admin Kampus</button>
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-tertiary);">
      Layanan Publik: <a href="verify.html" style="color: var(--blue-600); font-weight: 600;">Cek QR Code Tanpa Login &rarr;</a>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script>
    function loginAs(role) {
      setCurrentRole(role);
      showToast(`Masuk sebagai ${role}`);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 300);
    }
  </script>
</body>
</html>
